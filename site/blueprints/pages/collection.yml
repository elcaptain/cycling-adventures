title: Collection
icon: 🗺️

status:
  draft:
    label: Draft
    text: Not yet published
  listed:
    label: Published
    text: Visible in the adventures feed

columns:
  main:
    width: 2/3
    sections:
      content:
        type: fields
        fields:
          title:
            label: Title
            type: text
            required: true
            width: 2/3

          date:
            label: Date
            type: date
            required: true
            default: today
            width: 1/3
            help: Set to the date of the newest route

          intro:
            label: Introduction
            type: textarea
            maxlength: 800
            help: Shown at the top of the collection page

          sortorderHeading:
            label: Route Order
            type: headline
            numbered: false

          sortorder:
            label: Sort routes
            type: toggle
            text:
              - Oldest First
              - Newest First
            default: false

          routesHeading:
            label: Routes
            type: headline
            numbered: false

          routes:
            label: Routes
            type: pages
            query: site.find('adventures').childrenAndDrafts
            multiple: true
            search: true
            image:
              query: page.images.first
              ratio: 3/2
              cover: true
            help: Select adventures to include. Set each adventure to "Unlisted" (not Draft) to hide it from the main feed.

  sidebar:
    width: 1/3
    sections:
      meta:
        type: fields
        fields:
          coverimage:
            label: Cover Image
            type: files
            max: 1
            query: page.images
            help: Leave empty to auto-use the first route's cover image
