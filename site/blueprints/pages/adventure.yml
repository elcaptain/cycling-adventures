title: Adventure
icon: 🚴

# Status settings for draft/published
status:
  draft:
    label: Draft
    text: The adventure is not yet published
  listed:
    label: Published
    text: The adventure is published

# Main fields for the adventure
fields:
  # Basic information
  title:
    label: Adventure Title
    type: text
    required: true
    width: 2/3

  date:
    label: Date
    type: date
    required: true
    default: today
    width: 1/3

  description:
    label: Short Description
    type: textarea
    maxlength: 300
    help: Brief summary shown in the adventure list (max 300 characters)
    required: true

  # GPX Track
  gpxSection:
    label: GPX Track
    type: fields
    fields:
      gpxfile:
        label: GPX File
        type: files
        max: 1
        accept:
          - application/gpx+xml
          - text/xml
        help: Upload your GPX track file. Statistics will be extracted automatically.
        query: page.files.filterBy('extension', 'in', ['gpx'])

  # Ride Statistics
  # These can be auto-filled from GPX or manually entered
  statsSection:
    label: Ride Statistics
    type: fields
    fields:
      statsInfo:
        label: Info
        type: info
        text: These statistics can be extracted from the GPX file or entered manually

      duration:
        label: Total Duration
        type: text
        width: 1/2
        help: Format as "2h 30m" or "02:30:00"
        placeholder: "2h 30m"

      movingtime:
        label: Time in Motion
        type: text
        width: 1/2
        help: Format as "2h 15m" or "02:15:00"
        placeholder: "2h 15m"

      distance:
        label: Distance (km)
        type: number
        step: 0.1
        width: 1/3
        placeholder: "45.5"

      elevation:
        label: Elevation Gain (m)
        type: number
        step: 1
        width: 1/3
        placeholder: "650"

      avgspeed:
        label: Average Speed (km/h)
        type: number
        step: 0.1
        width: 1/3
        placeholder: "18.5"

  # Photos
  photosSection:
    label: Photos
    type: fields
    fields:
      photos:
        label: Photos
        type: files
        layout: cards
        size: small
        image:
          ratio: 3/2
          cover: true
        help: Upload photos from your adventure. EXIF data will be used to place them on the map.

  # Flexible Content Layout
  contentSection:
    label: Story & Content
    type: fields
    fields:
      layout:
        label: Content Layout
        type: blocks
        fieldsets:
          - heading
          - text
          - image
          - gallery
        help: Arrange text and photos to tell your adventure story

# Sidebar
sidebar:
  info:
    label: Preview
    type: fields
    fields:
      preview:
        label: Cover Image
        type: info
        text: The first photo will be used as the cover image in the adventure list
