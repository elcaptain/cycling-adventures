title: Adventure
icon: 🚴

# Status settings for draft/published
status:
  draft:
    label: Draft
    text: The adventure is not yet published
  unlisted:
    label: In Collection
    text: Hidden from the main feed, visible inside a collection
  listed:
    label: Published
    text: The adventure is published and visible in the main feed

columns:
  main:
    width: 2/3
    sections:
      content:
        type: fields
        fields:
          # Basic information
          title:
            label: Adventure Title
            type: text
            required: true
            width: 2/3

          date:
            label: Date
            type: date
            required: true
            default: today
            width: 1/3

          description:
            label: Short Description
            type: textarea
            maxlength: 500
            help: Brief summary shown in the adventure list (max 500 characters)

          # Layout Style
          layoutStyle:
            label: Page Layout
            type: toggle
            text:
              - Single Column
              - Two Column with Sticky Map
            width: 1/3

          # GPX Track Section
          gpxHeading:
            label: GPX Track
            type: headline
            numbered: false

          gpxfile:
            label: GPX Files
            type: files
            template: gpx
            help: Upload one GPX file per day. Statistics will be aggregated automatically.

          # Ride Statistics Section
          statsHeading:
            label: Ride Statistics
            type: headline
            numbered: false

          statsInfo:
            label: Info
            type: info
            text: These statistics can be extracted from the GPX file or entered manually

          duration:
            label: Total Duration
            type: text
            width: 1/5
            help: Format as "2h 30m" or "02:30:00"
            placeholder: "2h 30m"

          movingtime:
            label: Time in Motion
            type: text
            width: 1/5
            help: Format as "2h 15m" or "02:15:00"
            placeholder: "2h 15m"

          distance:
            label: Distance (km)
            type: number
            step: 0.1
            width: 1/5
            placeholder: "45.5"

          elevation:
            label: Elevation Gain (m)
            type: number
            step: 1
            width: 1/5
            placeholder: "650"

          avgspeed:
            label: Average Speed (km/h)
            type: number
            step: 0.1
            width: 1/5
            placeholder: "18.5"

          # Flexible Content Layout Section
          contentHeading:
            label: Story & Content
            type: headline
            numbered: false

          layout:
            label: Content Layout
            type: blocks
            fieldsets:
              - heading
              - text
              - image
              - gallery
              - daystats
            help: Arrange text and photos to tell your adventure story

          # Photos Section
          photosHeading:
            label: Photos
            type: headline
            numbered: false

          photos:
            label: Photos
            type: files
            layout: cards
            size: small
            image:
              ratio: 3/2
              cover: true
            help: Upload photos from your adventure. EXIF data will be used to place them on the map.

  sidebar:
    width: 1/3
    sections:
      coverimage:
        type: fields
        fields:
          coverimage:
            label: Cover Image
            type: files
            max: 1
            query: page.images
            help: Leave empty to use the first photo automatically
