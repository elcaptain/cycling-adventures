title: Adventures
icon: 🗺️

# This page contains all adventure posts
options:
  changeSlug: false
  changeStatus: false
  changeTemplate: false
  delete: false

# Child pages (individual adventures)
# Use `pages` so the Panel lists subpages (Kirby expects `pages` in blueprints)
sections:
  adventures:
    type: pages
    templates:
      - adventure
      - collection
    sortBy: date desc
    status: all
    label: Adventures & Collections
